name: Performance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Validate compiler
        run: cargo test --all-targets
      - name: Measure native performance
        id: perf
        run: |
          ./tools/flux-bench --runs 7 --batch 3 --json --no-fail > /tmp/flux-bench.json
          ratio=$(python3 -c 'import json; print(json.load(open("/tmp/flux-bench.json"))["workloads"]["calls"]["flux_vs_rust"])')
          printf 'ratio=%s\n' "$ratio" >> "$GITHUB_OUTPUT"
      - name: Upload performance probe
        uses: actions/upload-artifact@v4
        with:
          name: calls-rust-ratio-${{ steps.perf.outputs.ratio }}
          path: /tmp/flux-bench.json
      - name: Enforce native performance gate
        run: |
          python3 -c 'import json, sys; report=json.load(open("/tmp/flux-bench.json")); ratio=report["workloads"]["calls"]["flux_vs_rust"]; sys.exit(0 if ratio <= 1.25 else 1)'
