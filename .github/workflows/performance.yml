name: Performance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install native benchmark toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y at-spi2-core clang gir1.2-atspi-2.0 libgtk-4-dev pkg-config python3-gi xauth xvfb
      - name: Validate compiler
        run: cargo test --all-targets
      - name: Enforce native performance gate
        run: |
          registry="$(command -v at-spi2-registryd || find /usr/lib /usr/libexec -type f -name at-spi2-registryd -print -quit)"
          test -n "$registry"
          dbus-run-session -- bash -c '
            "$1" >/tmp/flux-atspi-registry.log 2>&1 &
            registry_pid=$!
            trap "kill $registry_pid 2>/dev/null || true" EXIT
            sleep 0.2
            xvfb-run -a env NO_AT_BRIDGE=0 ATSPI_NO_CACHE=1 ./tools/flux-bench --runs 7 --batch 3 --ui-timing --ui-timeout 15
          ' bash "$registry"
